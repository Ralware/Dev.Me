<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cafe Menu</title>
    <link href="CafeMenu.css" rel="stylesheet" />
  </head>
  <body>
    <div class="menu">
      <main>
        <h1>CAMPER CAFE</h1>
        <p class="established">Est. 2020</p>
        <hr />
        <section>
          <h2>Coffee</h2>
          <img
            src="https://cdn.freecodecamp.org/curriculum/css-cafe/coffee.jpg"
            alt="coffee icon"
          />
          <article class="item">
            <div class="flavor">French Vanilla</div>
            <div class="price">3.00</div>
          </article>
          <article class="item">
            <div class="flavor">Caramel Macchiato</div>
            <div class="price">3.75</div>
          </article>
          <article class="item">
            <div class="flavor">Pumpkin Spice</div>
            <div class="price">3.50</div>
          </article>
          <article class="item">
            <div class="flavor">Hazelnut</div>
            <div class="price">4.00</div>
          </article>
          <article class="item">
            <div class="flavor">Mocha</div>
            <div class="price">4.50</div>
          </article>
        </section>
        <section>
          <h2>Desserts</h2>
          <img
            src="https://cdn.freecodecamp.org/curriculum/css-cafe/pie.jpg"
            alt="pie icon"
          />
          <article class="item">
            <div class="dessert">Donut</div>
            <div class="price">1.50</div>
          </article>
          <article class="item">
            <div class="dessert">Cherry Pie</div>
            <div class="price">2.75</div>
          </article>
          <article class="item">
            <div class="dessert">Cheesecake</div>
            <div class="price">3.00</div>
          </article>
          <article class="item">
            <div class="dessert">Cinnamon Roll</div>
            <div class="price">2.50</div>
          </article>
        </section>
      </main>
      <hr class="bottom-line" />
      <footer>
        <address>
          <p>
            <a href="https://www.freecodecamp.org" target="_blank"
              >Visit our website</a
            >
          </p>
          <p class="address">123 Free Code Camp Drive</p>
        </address>
      </footer>
    </div>
  </body>
</html>
