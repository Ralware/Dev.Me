<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="Rock-Paper-Scissors-Styles.css"/>
    <script src="Rock-Paper-Scissors-Engine.js"></script>
</head>
<body>
<header class="Header">
    <h1 class="H1">Rock Paper Scissors Game</h1>
</header>

<section class="Button-Section">
    <button
            class="Button"
            onclick="
          ComputerMove();
          RockOutput();
        ">
        Rock
    </button>

    <button
            class="Button"
            onclick="
          ComputerMove();
          PaperOutput();
        ">
        Paper
    </button>

    <button
            class="Button"
            onclick="
          ComputerMove();
          ScissorsOutput();
        ">
        Scissors
    </button>
</section>
<div id="Result" class="Result-Div">Start Playing !</div>
<div id="Count" class="Result-Div">Your Wins And Losses Show Up Here !</div>
</body>
</html>
