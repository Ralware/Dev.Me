<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Calculator</title>
    <link rel="icon" type="image/x-icon" href="Sources/Divide.Icon.png" />
    <link rel="stylesheet" href="Calculator.css" />
  </head>
  <body class="Page">
    <section class="Row-Wrappers">
      <section class="Result-Section">
        <div class="Result-Text"></div>
      </section>
      <section class="Operations-Operands-Row">
        <section><button class="Button Number-Button">1</button></section>
        <section><button class="Button Number-Button">2</button></section>
        <section><button class="Button Number-Button">3</button></section>
        <section><button class="Operator-Button Operator">+</button></section>
      </section>
      <section class="Operations-Operands-Row">
        <section><button class="Button Number-Button">4</button></section>
        <section><button class="Button Number-Button">5</button></section>
        <section><button class="Button Number-Button">6</button></section>
        <section>
          <button class="Operator-Button Operator">-</button>
        </section>
      </section>
      <section class="Operations-Operands-Row">
        <section><button class="Button Number-Button">7</button></section>
        <section><button class="Button Number-Button">8</button></section>
        <section><button class="Button Number-Button">9</button></section>
        <section>
          <button class="Operator-Button Operator">*</button>
        </section>
      </section>
      <section class="Operations-Operands-Row">
        <section><button class="Button Number-Button">0</button></section>
        <section><button class="Button Dot-Button">.</button></section>
        <section><button class="Button Equal-Button">=</button></section>
        <section>
          <button class="Operator-Button Operator">/</button>
        </section>
      </section>
      <section class="Operations-Operands-Row">
        <section><button class="Button Clear-Button">Clear</button></section>
      </section>
    </section>
    <script src="Calculator.js"></script>
  </body>
</html>
